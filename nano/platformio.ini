; Arduino Nano Every sketches for the radio link. One project, one environment per board:
;   pio run -e sensor_node  -t upload     the Nano in the sensor unit
;   pio run -e base_station -t upload     the Nano on USB to the BeaglePlay
;   pio run -e radio_test   -t upload     range test (flash it on two Nanos, see src/radio_test)
; Shared headers are in include/ (radio_protocol.h is also used by the BeaglePlay firmware).

[platformio]
default_envs = sensor_node, base_station

[env]
platform  = atmelmegaavr
board     = nano_every
framework = arduino
lib_deps  = nrf24/RF24@^1.4.9
monitor_speed = 115200
build_flags = -Wall

[env:sensor_node]
build_src_filter = +<sensor_node/>

[env:base_station]
build_src_filter = +<base_station/>

[env:radio_test]
build_src_filter = +<radio_test/>
